<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>해벽 공지 도구</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&family=Noto+Sans+KR:wght@900&display=swap">
  <style>
    :root { --ink:#17191c; --muted:#6d6f6a; --line:#dcdad3; --bg:#f4f2ec; --acc:#0a7fc8; --font:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.55 var(--font); color:var(--ink); background:var(--bg); word-break:keep-all; }
    header, main { max-width:1080px; margin:0 auto; padding:0 16px; }
    header { padding-top:20px; }
    h1 { font-size:1.25rem; margin:0 0 2px; }
    .sub { color:var(--muted); margin:0 0 16px; font-size:.9rem; }
    main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; padding-bottom:48px; }
    @media (max-width:820px) { main { grid-template-columns:1fr; } }
    section { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
    h2 { font-size:1rem; margin:0 0 10px; }
    label { display:block; }
    .radios label { display:inline-block; margin:0 14px 6px 0; }
    select, input[type=text], input[type=time], textarea { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:inherit; }
    textarea { resize:vertical; }
    .row { display:flex; gap:10px; align-items:center; }
    .row > * { flex:1; }
    .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .cal-head button { font:inherit; padding:6px 12px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
    #cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .dow { text-align:center; font-size:.8rem; color:var(--muted); }
    .dow.sun { color:#c0392b; } .dow.sat { color:#2c6fb3; }
    .day { font:inherit; min-height:52px; padding:4px 2px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
    .day small { font-size:.62rem; line-height:1.15; color:#c0392b; word-break:keep-all; text-align:center; }
    .day.sun span { color:#c0392b; }
    .day.holiday { background:#fff4f2; }
    .day.on { background:var(--ink); color:#fff; border-color:var(--ink); }
    .day.on small, .day.on.sun span { color:#ffd3cc; }
    .hint { color:var(--muted); font-size:.85rem; margin:8px 0 0; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .chip { font:inherit; font-size:.85rem; padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:#fff; cursor:pointer; }
    .preview { position:sticky; top:12px; align-self:start; }
    canvas { width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .empty { color:var(--muted); text-align:center; padding:8px 0 0; }
    .out { margin-top:12px; }
    .out .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-weight:700; font-size:.9rem; }
    .btn { font:inherit; font-size:.9rem; padding:6px 12px; border:1px solid var(--ink); border-radius:8px; background:var(--ink); color:#fff; cursor:pointer; }
    .btn.ghost { background:#fff; color:var(--ink); }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    pre { margin:0; padding:10px; background:#f7f6f1; border:1px solid var(--line); border-radius:8px; white-space:pre-wrap; font-size:.8rem; overflow:auto; }
    .note { color:var(--muted); font-size:.85rem; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header>
    <h1>공지 도구 <small style="font-weight:400;color:#6d6f6a">프로토타입</small></h1>
    <p class="sub">공지 종류를 고르고 날짜만 누르면 이미지와 글이 같이 만들어져요. 확인만 하고 복사해서 올리세요.</p>
  </header>
  <main>
    <div>
      <section>
        <h2>외벽</h2>
        <select id="wallSel" aria-label="외벽"></select>
        <p class="note" id="lockNote" hidden>이 링크는 이 외벽 전용이에요.</p>
      </section>
      <section>
        <h2>1. 공지 종류</h2>
        <div class="radios" id="kinds"></div>
      </section>
      <section>
        <h2>2. 날짜</h2>
        <div class="cal-head"><button type="button" id="prev" aria-label="이전 달">‹</button><strong id="monthLabel"></strong><button type="button" id="next" aria-label="다음 달">›</button></div>
        <div id="cal"></div>
        <p class="hint" id="calHint"></p>
      </section>
      <section>
        <h2>3. 내용</h2>
        <div id="reasonBox" hidden>
          <label>사유<input type="text" id="reason" maxlength="30" placeholder="예: 기상 악화"></label>
          <div class="chips" id="chips"></div>
        </div>
        <div id="hoursBox" hidden>
          <div class="row" style="margin-top:10px"><label>시작<input type="time" id="open"></label><label>끝<input type="time" id="close"></label></div>
          <p class="note" id="hoursNote" hidden>해벽에 날짜별 운영시간을 반영하려면 데이터 형식을 넓혀야 해요(지금은 미리보기만).</p>
        </div>
        <label style="margin-top:10px">덧붙일 말 (선택)<textarea id="note" rows="2" maxlength="200" placeholder="예: 예약자는 개별 연락드립니다."></textarea></label>
      </section>
      <section>
        <h2>우리 외벽 설정 <span class="note">(이 기기에 저장)</span></h2>
        <div class="radios" id="closings"></div>
        <div class="row" style="margin-top:8px"><label>서명<input type="text" id="sign" maxlength="30" placeholder="비우면 외벽 이름"></label><label style="max-width:110px">대표 색<input type="color" id="accent" style="width:100%;height:40px"></label></div>
      </section>
    </div>
    <div class="preview">
      <section>
        <h2>이미지</h2>
        <canvas id="card" width="1080" height="1350" aria-label="공지 이미지 미리보기"></canvas>
        <p class="empty" id="empty">날짜를 고르면 이미지가 만들어져요.</p>
        <div class="row" style="margin-top:10px"><button class="btn" type="button" id="saveImg">이미지 저장 · 공유</button></div>
        <p class="note" id="shareSay"></p>
        <div class="out"><div class="bar">제목 <button class="btn ghost" type="button" id="copyTitle">복사</button></div><textarea id="outTitle" rows="1" readonly></textarea></div>
        <div class="out"><div class="bar">본문 (카페·블로그) <button class="btn ghost" type="button" id="copyBody">복사</button></div><textarea id="outBody" rows="9" readonly></textarea></div>
        <div class="out"><div class="bar">인스타 캡션 <button class="btn ghost" type="button" id="copyCaption">복사</button></div><textarea id="outCaption" rows="9" readonly></textarea></div>
      </section>
      <section>
        <h2>해벽에 반영</h2>
        <pre id="patch"></pre>
        <div class="row" style="margin-top:10px"><button class="btn" type="button" id="reflectBtn" disabled>해벽에 반영</button></div>
        <p class="note" id="reflectNote"></p>
      </section>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
