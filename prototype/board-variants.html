<!doctype html>
<!-- PROTOTYPE — throwaway. Question: what should the 한 줄 타임라인 (board full view) look like in the 해벽 brand?
     Three variants of the same mock data, switchable with ?variant=A|B|C (or ← →). Read-only; no Worker, no storage.
     Run: npm run serve → http://localhost:8000/prototype/board-variants.html?variant=A -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · board variants</title>
<link rel="stylesheet" href="../style.css">
<style>
button, input { font-family: inherit; }
#stage { max-width: 440px; margin: 0 auto; min-height: 100dvh; padding: 0 0 96px; }
.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 6px 24px rgb(0 0 0 / .35); font: 600 13px/1 system-ui, sans-serif; white-space: nowrap; }
.proto-bar button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: #333; color: #fff; font-size: 16px; cursor: pointer; }
.stk { filter: drop-shadow(2px 0 0 var(--sticker)) drop-shadow(-2px 0 0 var(--sticker)) drop-shadow(0 2px 0 var(--sticker)) drop-shadow(0 -2px 0 var(--sticker)) drop-shadow(1px 3px 0 color-mix(in srgb, var(--fg) 24%, transparent)); }
.hexbolt { clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
.sendbtn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); }
.sendbtn svg { width: 19px; height: 19px; margin-left: 2px; }
input.t { font: inherit; color: var(--fg); background: none; border: 0; min-width: 0; }
input.t:focus { outline: none; }
.mut { color: var(--muted); font-size: var(--fs-xs); }

/* ───────── A · 볕과 그늘: day sections, sun on today's, slab shade on the older; a time gutter, type only ───────── */
.A-head { position: relative; overflow: hidden; padding: 22px 20px 18px; background: color-mix(in srgb, var(--sun-disc) 22%, var(--bg)); }
.A-head .sun { position: absolute; top: -52px; right: 36px; width: 132px; height: 132px; border-radius: 50%; background: var(--sun-disc); }
.A-head .slab { position: absolute; top: 0; bottom: 0; right: 0; width: 28%; background: var(--shade-ink); clip-path: polygon(0 0, 100% 0, 100% 100%, 46% 100%); }
.A-head h1 { position: relative; margin: 0; font-size: 1.5rem; letter-spacing: -.02em; }
.A-head p { position: relative; margin: 4px 0 0; color: var(--muted); font-size: var(--fs-sm); }
.A-compose { display: flex; align-items: center; gap: 8px; margin: 14px 20px 0; padding: 4px 4px 4px 16px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--fg); }
.A-compose .t { flex: 1; min-height: 40px; }
.A-day { display: flex; align-items: center; gap: 10px; margin: 26px 20px 4px; font-size: var(--fs-sm); font-weight: 800; letter-spacing: .02em; }
.A-day::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--sun-disc); }
.A-day.shade::before { background: var(--shade-ink); clip-path: polygon(0 0, 100% 0, 100% 100%, 40% 100%); border-radius: 0; }
.A-day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.A-post { display: grid; grid-template-columns: 52px 1fr; gap: 0 12px; padding: 12px 20px; }
.A-time { padding-top: 3px; text-align: right; font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.A-body b { font-size: var(--fs-sm); }
.A-body p { margin: 2px 0 0; font-size: 1.0625rem; line-height: 1.55; overflow-wrap: anywhere; }
.A-meta { margin-top: 6px; display: flex; gap: 14px; font-size: var(--fs-xs); color: var(--muted); }
.A-meta .rp { color: var(--accent); font-weight: 700; }
.A-day.shade ~ .A-post { background: linear-gradient(90deg, color-mix(in srgb, var(--shade-ink) 55%, transparent) 0 3px, transparent 3px); }

/* ───────── B · 벽 위의 대화: the list is a wall (bolt holes, sun, slab); white panels; mine on the right; composer docked ───────── */
.B-wall { position: relative; isolation: isolate; min-height: 100dvh; padding: 16px 14px 150px; background-color: color-mix(in srgb, #dfe7bf 50%, var(--plate)); }
:root[data-theme="dark"] .B-wall { background-color: color-mix(in srgb, #dfe7bf 16%, var(--plate)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .B-wall { background-color: color-mix(in srgb, #dfe7bf 16%, var(--plate)); } }
.B-wall::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(circle, color-mix(in srgb, var(--fg) 13%, transparent) 2px, transparent 2.6px); background-size: 26px 26px; background-position: 13px 13px; }
.B-wall .sun { position: absolute; z-index: -1; top: -40px; right: 40px; width: 120px; height: 120px; border-radius: 50%; background: var(--sun-disc); }
.B-wall .slab { position: absolute; z-index: -1; top: 0; bottom: 0; right: 0; width: 22%; background: var(--shade-ink); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%); }
.B-title { margin: 6px 4px 18px; font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
.B-row { display: flex; align-items: flex-end; gap: 6px; margin: 0 0 14px; }
.B-row img { flex: none; width: 54px; height: 54px; margin-bottom: -4px; }
.B-bub { position: relative; max-width: 78%; padding: 9px 13px 8px; border-radius: 18px 18px 18px 4px; background: var(--sheet); border: 1.5px solid var(--fg); line-height: 1.5; box-shadow: 2px 3px 0 color-mix(in srgb, var(--fg) 22%, transparent); }
.B-bub b { display: block; font-size: var(--fs-xs); color: var(--muted); font-weight: 700; margin-bottom: 1px; }
.B-bub span { overflow-wrap: anywhere; }
.B-bub .mut { display: block; margin-top: 3px; }
.B-row.me { flex-direction: row-reverse; }
.B-row.me .B-bub { border-radius: 18px 18px 4px 18px; background: var(--accent); color: var(--on-accent); }
.B-row.me .B-bub b, .B-row.me .B-bub .mut { color: color-mix(in srgb, var(--on-accent) 75%, transparent); }
.B-dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: 68px; width: min(440px, 100%); box-sizing: border-box; padding: 0 12px; }
.B-dock div { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 16px; border-radius: 999px; background: var(--sheet); border: 1.5px solid var(--fg); box-shadow: 0 6px 18px rgb(0 0 0 / .18); }
.B-dock .t { flex: 1; min-height: 40px; }

/* ───────── C · 루트 메모: paper notes taped on the wall, two columns, tilted; compose is the first blank note ───────── */
.C-wrap { padding: 18px 14px 0; }
.C-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 14px; }
.C-title h1 { margin: 0; font-size: 1.25rem; letter-spacing: -.02em; }
.C-cols { columns: 2; column-gap: 12px; }
.C-note { position: relative; break-inside: avoid; margin: 0 0 14px; padding: 20px 12px 10px; background: var(--plate); border: 1.5px solid var(--fg); border-radius: 4px 4px 12px 4px; box-shadow: 2px 3px 0 color-mix(in srgb, var(--fg) 20%, transparent); transform: rotate(var(--r, 0deg)); }
.C-note::before { content: ""; position: absolute; top: -8px; left: 50%; width: 46px; height: 16px; transform: translateX(-50%) rotate(-3deg); background: hsl(var(--h) 70% 62% / .85); }
.C-note p { margin: 0; font-size: var(--fs-md); line-height: 1.5; overflow-wrap: anywhere; }
.C-by { display: flex; align-items: center; gap: 4px; margin-top: 10px; padding-top: 6px; border-top: 1px dashed var(--line-strong); font-size: var(--fs-xs); }
.C-by img { width: 26px; height: 26px; margin: -14px 0 -4px -4px; }
.C-by b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.C-by .mut { flex: none; }
.C-new { border-style: dashed; background: none; box-shadow: none; --r: 0deg; }
.C-new::before { content: none; }
.C-new .t { width: 100%; min-height: 56px; font-size: var(--fs-md); }
.C-new .go { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
</style></head>
<body><div id="stage"></div>
<script>
const NOW = Date.now(), H = 3600e3;
const CODES = ['owl', 'spider', 'goat', 'otter', 'gecko', 'cat', 'raccoon', 'squirrel'];
const POSTS = [
  { nick: '해벽러', body: '오늘 3번 벽 새로 셋팅됐어요! 파란색 V4 진짜 재밌음', ago: 0.03, rc: 2, mine: true },
  { nick: 'Mina', body: '주말 오전엔 사람 거의 없어요. 추천!', ago: 3 },
  { nick: '초보클라이머', body: '신발 렌탈 되나요?', ago: 5, rc: 1 },
  { nick: '고양이', body: '주차 2시간 무료였어요. 아주아주 긴 글도 잘 줄바꿈되는지 확인하기 위해 길게 써봅니다 가나다라마바사', ago: 30 },
  { nick: '동동', body: '볕 좋아서 오후 2시쯤 양달 루트 갔다가 땀 뺐네요', ago: 52 },
  { nick: '라쿤', body: '노란 홀드 조심! 오늘 하나 돌았어요', ago: 80 },
];
const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const char = (n) => `../assets/climbers/${CODES[hash(n) % 8]}.png`;
const hue = (n) => (hash(n) * 7) % 360;
const age = (h) => (h < 1 ? `${Math.max(1, Math.round(h * 60))}분 전` : h < 24 ? `${Math.round(h)}시간 전` : `${Math.floor(h / 24)}일 전`);
const clock = (h) => { const d = new Date(NOW - h * H); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const SEND = '<svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.5L15 12 3.39 13.9z" fill="currentColor"/></svg>';

const V = {
  A: { name: '볕과 그늘 — 날짜별 섹션, 시간 거터', html() {
    const today = POSTS.filter((p) => p.ago < 24), older = POSTS.filter((p) => p.ago >= 24);
    const row = (p) => `<div class="A-post"><div class="A-time">${p.ago < 24 ? clock(p.ago) : `${Math.floor(p.ago / 24)}일 전`}</div><div class="A-body"><b>${esc(p.nick)}</b><p>${esc(p.body)}</p><div class="A-meta">${p.rc ? `<span class="rp">답글 ${p.rc}</span>` : '<span class="rp">답글</span>'}<span>${p.mine ? '삭제' : '신고'}</span></div></div></div>`;
    return `<header class="A-head"><div class="sun"></div><div class="slab"></div><h1>한 줄 타임라인</h1><p>오늘 이 벽에서 있었던 일, 한 줄로</p></header>
      <div class="A-compose"><input class="t" placeholder="한 줄 남기기" aria-label="한 줄 남기기"><span class="mut">0/140</span><button class="sendbtn" aria-label="남기기">${SEND}</button></div>
      <div class="A-day">오늘</div>${today.map(row).join('')}
      <div class="A-day shade">지난 글</div>${older.map(row).join('')}`;
  } },
  B: { name: '벽 위의 대화 — 암벽 배경 말풍선', html() {
    return `<div class="B-wall"><div class="sun"></div><div class="slab"></div><h1 class="B-title">한 줄 타임라인</h1>
      ${[...POSTS].reverse().map((p) => `<div class="B-row ${p.mine ? 'me' : ''}"><img class="stk" src="${char(p.nick)}" alt=""><div class="B-bub"><b>${esc(p.nick)}</b><span>${esc(p.body)}</span><span class="mut">${age(p.ago)}${p.rc ? ` · 답글 ${p.rc}` : ''}</span></div></div>`).join('')}</div>
      <div class="B-dock"><div><input class="t" placeholder="한 줄 남기기" aria-label="한 줄 남기기"><button class="sendbtn" aria-label="남기기">${SEND}</button></div></div>`;
  } },
  C: { name: '루트 메모 — 테이프 붙인 두 열 메모', html() {
    const rot = ['-1.2deg', '.9deg', '-.6deg', '1.3deg', '-.9deg', '.5deg'];
    return `<div class="C-wrap"><div class="C-title"><h1>한 줄 타임라인</h1><span class="mut">메모 ${POSTS.length}</span></div><div class="C-cols">
      <div class="C-note C-new"><input class="t" placeholder="한 줄 남기기" aria-label="한 줄 남기기"><div class="go"><span class="mut">0/140</span><button class="sendbtn" aria-label="붙이기">${SEND}</button></div></div>
      ${POSTS.map((p, i) => `<div class="C-note" style="--h:${hue(p.nick)};--r:${rot[i % 6]}"><p>${esc(p.body)}</p><div class="C-by"><img class="stk" src="${char(p.nick)}" alt=""><b>${esc(p.nick)}</b><span class="mut">${age(p.ago)}</span></div></div>`).join('')}</div></div>`;
  } },
};
const keys = Object.keys(V);
const stage = document.getElementById('stage');
const bar = document.createElement('div');
bar.className = 'proto-bar';
bar.innerHTML = '<button data-d="-1" aria-label="이전">←</button><span id="lbl"></span><button data-d="1" aria-label="다음">→</button>';
function show(k, push) {
  if (!V[k]) k = 'A';
  stage.innerHTML = V[k].html();
  bar.querySelector('#lbl').textContent = `${k} (${V[k].name.split(' — ')[0]})`;
  if (push) { const u = new URL(location.href); u.searchParams.set('variant', k); history.replaceState(null, '', u); }
  document.documentElement.dataset.v = k;
}
const cur = () => new URLSearchParams(location.search).get('variant')?.toUpperCase() || 'A';
const step = (d) => show(keys[(keys.indexOf(cur()) + d + keys.length) % keys.length], true);
bar.addEventListener('click', (e) => { const d = e.target.dataset?.d; if (d) step(Number(d)); });
addEventListener('keydown', (e) => { if (e.target.closest?.('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
if (location.hostname !== 'haebyeok.app') document.body.append(bar);
show(cur());
</script></body></html>
