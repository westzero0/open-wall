<!doctype html>
<!--
  Open Graph 이미지 템플릿 (1200×630)
  generate-assets.js 가 이중 중괄호 자리표시자를 채워 PNG로 렌더링한다.
  브라우저에서 직접 열어 디자인을 확인할 수도 있다(자리표시자 그대로 보임).
  자리표시자: CSS_VARS, LOGO_FULL, SYMBOL, TITLE, SUBTITLE, TAG, FONT_SANS
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>해벽 OG</title>
<style>
  :root { --primary-yellow: #F3B63F; --primary-black: #2B2B2B; --logo-text: #2B2B2B; --logo-sub: #2B2B2B; --brand-paper: #F4F4F0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background: var(--brand-paper, #F4F2EC);
    color: var(--primary-black, #111);
    font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 오른쪽: 심볼을 크게 잘라 배치 (원 = 하나의 노란 덩어리) */
  .symbol {
    position: absolute; right: 10px; top: 40px;
    width: 560px; height: 560px;
  }
  .symbol svg { width: 100%; height: 100%; display: block; }
  /* 하단 블랙 라인 */
  .stripe {
    position: absolute; left: 0; bottom: 0; width: 1200px; height: 18px;
    background: var(--primary-black, #111);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
  .logo { position: absolute; left: 72px; top: 64px; }
  .logo svg { height: 96px; width: auto; display: block; }
  .copy { position: absolute; left: 72px; bottom: 96px; max-width: 640px; }
  .title {
    font-size: 84px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em;
    word-break: keep-all;
  }
  .subtitle {
    margin-top: 22px; font-size: 32px; line-height: 1.4; font-weight: 500;
    letter-spacing: -0.01em; opacity: .78; word-break: keep-all;
  }
  .tag {
    position: absolute; left: 72px; bottom: 40px;
    font-size: 22px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="symbol"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="og-b-title">
  <title id="og-b-title">해벽 HAEBYEOK 심볼</title>
  <style>
    :root {
      --primary-yellow: #F3B63F;
      --primary-black: #2B2B2B;
      --logo-text: #2B2B2B;
      --logo-sub: #2B2B2B;
    }
    @media (prefers-color-scheme: dark) {
      :root { --primary-black: #F2F2EE; --logo-text: #F2F2EE; --logo-sub: #F2F2EE; }
    }
    .hb-circle { fill: var(--primary-yellow, #F3B63F); }
    .hb-wall   { fill: var(--primary-black, #2B2B2B); }
    .hb-text   { fill: var(--logo-text, #2B2B2B); }
    .hb-sub    { fill: none; stroke: var(--logo-sub, #2B2B2B); stroke-width: 10; stroke-linejoin: miter; stroke-miterlimit: 4; }
  </style>
  <circle class="hb-circle" cx="236" cy="200" r="184"/>
    <polygon class="hb-wall" points="193,16 386,16 386,496 358,496"/>
</svg>
</div>

</div>
