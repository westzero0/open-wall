<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>오늘의 양달·응달</title>
<style>{{BASE_CSS}}
  .rows { gap: 12px; }
  .row { padding: 18px 28px; }
  .row .name { font-size: 36px; }
  .row .rank { width: 50px; height: 50px; font-size: 26px; }
  .row .meta { margin-bottom: 10px; }
</style></head>
<body>
  <div class="hero">
    <div class="bigsym">{{BIGSYM}}</div>
    <div class="top"><div class="logo">{{LOGO_Y}}</div><div class="date">{{DATE}}<small>{{WEEKDAY}}</small></div></div>
    <div class="head"><div class="eyebrow">SUN &amp; SHADE</div><div class="title">오늘의<br>양달·응달</div></div>
  </div>
  <div class="rows">{{ROWS}}</div>
  <div class="legend"><span><i class="s"></i>양달</span><span><i class="o"></i>운영 중 그늘·실내</span><span><i class="c"></i>닫힘</span><em>막대 06시–24시</em></div>
  <div class="foot"><div class="note">{{NOTE}}</div><div class="site">{{SITE}}</div></div>
  <div class="bar-bottom"></div>
</body></html>
