<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>암장 소개</title>
<style>{{BASE_CSS}}
  .photo { position: absolute; left: 72px; right: 72px; top: 190px; height: 520px; border-radius: 32px; overflow: hidden; background: #DDD9CE; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo.empty { background: var(--primary-yellow); }
  .photo .credit { position: absolute; right: 18px; bottom: 14px; font-size: 20px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .sym { position: absolute; right: 90px; top: 130px; width: 360px; height: 360px; }
  .body { position: absolute; left: 72px; right: 72px; top: 750px; }
  .body .region { font-size: 28px; font-weight: 700; opacity: .65; }
  .body .name { margin-top: 8px; font-size: 76px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; }
  .facts { margin-top: 34px; display: flex; flex-direction: column; gap: 16px; }
  .fact { display: flex; gap: 22px; align-items: baseline; font-size: 31px; font-weight: 600; }
  .fact b { flex: none; width: 128px; font-size: 25px; font-weight: 800; letter-spacing: .04em; opacity: .55; }
  .tags { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; }
  .tags span { font-size: 24px; font-weight: 700; padding: 8px 18px; border-radius: 999px; background: #FFFFFF; }
</style></head>
<body>
  <div class="top"><div class="logo">{{LOGO}}</div><div class="date">{{DATE}}<small>{{WEEKDAY}}</small></div></div>
  <div class="photo {{PHOTO_CLASS}}">{{PHOTO}}</div>
  <div class="body">
    <div class="region">{{REGION}}</div>
    <div class="name">{{NAME}}</div>
    <div class="facts">{{FACTS}}</div>
    <div class="tags">{{TAGS}}</div>
  </div>
  <div class="foot"><div class="note">{{NOTE}}</div><div class="site">{{SITE}}</div></div>
  <div class="bar"></div>
</body></html>
