<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>제보 감사</title>
<style>{{BASE_CSS}}
  body { background: var(--primary-yellow); }
  .fullsym { position: absolute; right: -380px; top: 110px; width: 1100px; height: 1100px; }
  .copy { position: absolute; left: 72px; top: 400px; right: 72px; z-index: 2; }
  .copy .big { font-size: 170px; font-weight: 900; letter-spacing: -0.06em; line-height: 1.0; }
  .copy .sub { margin-top: 44px; font-size: 46px; font-weight: 800; line-height: 1.4; max-width: 640px; }
  .copy .name { background: var(--primary-black); color: var(--primary-yellow); padding: 0 14px; }
  .top .date small { opacity: .7; }
</style></head>
<body>
  <div class="fullsym">{{BIGSYM}}</div>
  <div class="top"><div class="logo">{{LOGO_Y}}</div><div class="date">{{DATE}}<small>{{WEEKDAY}}</small></div></div>
  <div class="copy">
    <div class="big">제보<br>고마워요</div>
    <div class="sub"><span class="name">{{NAME}}</span> {{NOTE_LINE}}</div>
  </div>
  <div class="foot"><div class="note" style="opacity:.8">틀린 정보는 앱의 ‘정보 수정 요청’으로 알려 주세요.</div><div class="site">{{SITE}}</div></div>
  <div class="bar-bottom"></div>
</body></html>
